name: |
  Publish Helm chart

on:
  workflow_dispatch: {}
  push:
    tags:
      - v*

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "Helm Chart Automation"
          git config user.email "rosmo@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
      - name: Package Helm charts
        run: |
          mkdir -p .cr-release-packages
          for chart in deploy/*/; do
            if [ -f "${chart}Chart.yaml" ]; then
              helm package "${chart}" --destination .cr-release-packages
            fi
          done

      - name: Authenticate to Google Cloud (OSS Exit Gate)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          project_id: 'oss-exit-gate-prod'
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      - name: Stage release artifacts to OSS Exit Gate and upload manifest
        env:
          TAG_NAME: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if gcloud artifacts versions describe "${TAG_NAME}" \
            --package="gke-autoneg-controller" \
            --project="oss-exit-gate-prod" \
            --location="us" \
            --repository="gke-autoneg-controller--githubreleases" >/dev/null 2>&1; then
            gcloud artifacts versions delete "${TAG_NAME}" \
              --package="gke-autoneg-controller" \
              --project="oss-exit-gate-prod" \
              --location="us" \
              --repository="gke-autoneg-controller--githubreleases" \
              --quiet
          fi
          for f in .cr-release-packages/*.tgz; do
            [ -e "$f" ] || continue
            gcloud artifacts generic upload \
              --project="oss-exit-gate-prod" \
              --location="us" \
              --repository="gke-autoneg-controller--githubreleases" \
              --package="gke-autoneg-controller" \
              --version="${TAG_NAME}" \
              --source="$f"
          done
          cat <<EOF > manifest.json
          {
            "publish_all": false,
            "publishing_groups": [
              {
                "packages": [
                  {
                    "name": "gke-autoneg-controller",
                    "version": "${TAG_NAME}"
                  }
                ]
              }
            ]
          }
          EOF
          gcloud storage cp manifest.json \
            "gs://oss-exit-gate-prod-projects-bucket/gke-autoneg-controller/githubreleases/manifests/manifest-${TAG_NAME}-${RUN_ID}-${RUN_ATTEMPT}.json"
